<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1128">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>أوتايا - معلمك أقرب إليك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1128;--card:#141d40;--line:#26315f;--text:#f2f3f8;--mute:#9aa3c7;--gold:#f5b301;--ok:#2fbf71}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
.inst{margin-bottom:12px}
.btn.inst-b{background:#fff;color:#0b1128}
.inst .hint{text-align:center}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:18px 18px 40px}
.view{display:none}.view.on{display:block}
h2{font-size:23px;font-weight:800;margin-bottom:12px}
.home{min-height:82vh;flex-direction:column;justify-content:flex-start;text-align:center}
.hero{position:relative;margin:-18px -18px 0;height:300px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,17,40,.1),rgba(11,17,40,.35) 55%,var(--bg) 97%)}
.home h1{position:relative;margin-top:-52px}
.view.home.on{display:flex}
.home h1{font-size:42px;font-weight:800;color:var(--gold);line-height:1.2}
.sub{color:var(--mute);margin:4px 0 24px}
button,select,input{font:inherit}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#1a1400;font-weight:800;font-size:18px;cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--text);border:1.5px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.6}
.back{background:none;border:0;color:var(--mute);padding:6px 0;margin-bottom:8px;cursor:pointer;font-size:16px}
label{display:block;margin:12px 0 5px;color:var(--mute);font-size:15px}
select,input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:14px;color:var(--mute);margin-top:5px}
.list{margin-top:16px;display:grid;gap:12px}
.w{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.w b{font-size:19px}
.m{color:var(--mute);font-size:15px}
.rating{color:var(--gold);font-size:15px;margin:2px 0 10px}
.badge{display:inline-block;margin-inline-start:8px;padding:0 9px;border-radius:99px;background:rgba(47,191,113,.15);color:var(--ok);font-size:13px;font-weight:600}
.badge.off{background:rgba(154,163,199,.15);color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.act{flex:1;min-width:90px;padding:10px;border-radius:9px;text-align:center;text-decoration:none;font-weight:600;border:1.5px solid var(--line);color:var(--text);background:none;cursor:pointer;font-size:15px}
.act.wa{background:#1faa59;border-color:#1faa59;color:#fff}
.act.on{background:var(--gold);border-color:var(--gold);color:#1a1400}
.act.del{color:#ff8a8a}
.empty,.msg{margin-top:14px;padding:13px;border-radius:10px;background:var(--card);color:var(--mute);text-align:center}
.msg.ok{color:var(--ok)}.msg.err{color:#ff8a8a}
.demo{background:#3a2d00;color:#ffd666;font-size:14px;padding:8px 14px;text-align:center}
.rate{margin-top:8px}
.stars{display:flex;gap:4px}
.star{background:none;border:0;font-size:32px;line-height:1;color:var(--gold);cursor:pointer;padding:0 2px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.ph img{width:100%;height:96px;object-fit:cover;border-radius:8px}
.stat{font-size:30px;font-weight:800;color:var(--gold);line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chips .act{flex:none;min-width:0;padding:4px 11px;font-size:14px}
.foot{text-align:center;margin-top:26px}
.foot button{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.view.on{animation:in .25s ease}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>

const JOBS = ["سباك (صحية)","كهربجي","نجار","نجار موبيلية","نجار باطون","حداد","بلاط","ملاس (قصارة)","طيان","معمرجي","دهّان","جبّاس (ديكور جبصين)","عازل (عزل أسطح ومياه)","عامل ألمنيوم وزجاج","مصلح غسالات","مصلح برادات","مصلح مكيفات","مصلح سخانات وغاز","مصلح مدافئ","فني ستلايت وانترنت","فني كمبيوتر وموبايل","منجّد","فني ستائر","فني أقفال ومفاتيح","فني تركيب مطابخ","نقل وتنزيل عفش وأثاث","عامل تنظيف منازل","عاملة تنظيف منازل","ميكانيكي سيارات","كهربجي سيارات","مهنة أخرى"];

const $ = id => document.getElementById(id);
const live = !!(FIREBASE.projectId && FIREBASE.apiKey);
if (!live) $("demo").hidden = false;
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const digits = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
const intl = p => { p = digits(p); if (p.startsWith("00")) p = p.slice(2); if (p.startsWith("0")) p = "963" + p.slice(1); return p; };
function el(tag, props = {}, kids = []){ const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; }
const msg = (t, c = "") => el("div", { className: "msg " + c, textContent: t });
const norm = w => ({ sum:0, count:0, clicks:0, available:true, verified:false, paidUntil:0, photos:"[]", province:"", ...w });
const score = w => (w.sum + 10.5) / (w.count + 3);

/* ===== التخزين ===== */
const BASE = live ? `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents` : "";
const enc = v => typeof v === "boolean" ? { booleanValue: v } : typeof v === "number" ? { integerValue: String(Math.round(v)) } : { stringValue: String(v) };
const dec = f => { const o = {}; for (const k in f){ const x = f[k]; o[k] = "integerValue" in x ? +x.integerValue : "booleanValue" in x ? x.booleanValue : x.stringValue; } return o; };
async function fs(path, method, body, mask){
  let url = `${BASE}/${path}`;
  const q = (mask ? mask.map(m => "updateMask.fieldPaths=" + m).join("&") + "&" : "") + "key=" + FIREBASE.apiKey;
  url += (url.includes("?") ? "&" : "?") + q;
  const init = { method, headers: { "Content-Type": "application/json" } };
  if (body) init.body = JSON.stringify({ fields: Object.fromEntries(Object.entries(body).map(([k, v]) => [k, enc(v)])) });
  const r = await fetch(url, init);
  if (!r.ok) throw new Error(r.status);
  return method === "DELETE" ? null : r.json();
}
const LIST_FIELDS = ["name","job","province","area","phone","verified","sum","count","clicks","available","paidUntil"];
async function dbQuery(f, limit, offset){
  if (!live){
    const a = (LS.get("ow") || []).map(norm).filter(w => Object.keys(f).every(k => w[k] === f[k]));
    return a.slice(offset, offset + limit);
  }
  const filters = Object.entries(f).map(([k, v]) => ({ fieldFilter: { field: { fieldPath: k }, op: "EQUAL", value: { stringValue: v } } }));
  const q = { from: [{ collectionId: "workers" }], select: { fields: LIST_FIELDS.map(x => ({ fieldPath: x })) }, limit, offset };
  if (filters.length === 1) q.where = filters[0];
  else if (filters.length > 1) q.where = { compositeFilter: { op: "AND", filters } };
  const r = await fetch(`${BASE}:runQuery?key=${FIREBASE.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ structuredQuery: q }) });
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).filter(x => x.document).map(x => norm({ id: x.document.name.split("/").pop(), ...dec(x.document.fields || {}) }));
}
async function dbGet(id){
  if (!live) return (LS.get("ow") || []).map(norm).find(w => w.id === id) || null;
  try {
    const j = await fs("workers/" + id + "?" + LIST_FIELDS.map(f => "mask.fieldPaths=" + f).join("&"), "GET");
    return norm({ id, ...dec(j.fields || {}) });
  } catch(e){ if (String(e.message) === "404") return null; throw e; }
}
async function dbPhotos(id){
  try {
    if (!live) return JSON.parse(((LS.get("ow") || []).find(w => w.id === id) || {}).photos || "[]");
    const j = await fs("workers/" + id, "GET");
    return JSON.parse(dec(j.fields || {}).photos || "[]");
  } catch(e){ return []; }
}
async function dbAdd(w){
  if (!live){ const a = LS.get("ow") || []; const id = Date.now().toString(36); a.push({ id, ...w }); LS.set("ow", a); return id; }
  const j = await fs("workers", "POST", w);
  return j.name.split("/").pop();
}
async function dbSet(id, patch){
  if (!live){ const a = LS.get("ow") || []; const x = a.find(w => w.id === id); if (x) Object.assign(x, patch); LS.set("ow", a); return; }
  await fs("workers/" + id, "PATCH", patch, Object.keys(patch));
}
async function getPaid(){
  if (!live) return LS.get("op") || [];
  try { const j = await fs("config/areas", "GET"); return (dec(j.fields || {}).paid || "").split("|").filter(Boolean); }
  catch(e){ return []; }
}

/* ===== القوائم ===== */
function fill(sel, items, all){
  sel.innerHTML = "";
  if (all) sel.add(new Option(all, ""));
  items.forEach(v => sel.add(new Option(v, v)));
}
function areaOpts(selP, selA, all){
  const p = selP.value;
  fill(selA, p ? AREAS[p] : [...AREAS["دمشق"], ...AREAS["ريف دمشق"]], all);
}
fill($("fj"), JOBS, "كل المهن");
fill($("fp"), Object.keys(AREAS), "دمشق وريفها"); areaOpts($("fp"), $("fa"), "كل المناطق");
fill($("rj"), JOBS);
fill($("rp"), Object.keys(AREAS)); areaOpts($("rp"), $("ra"));
$("fp").onchange = () => { areaOpts($("fp"), $("fa"), "كل المناطق"); search(); };
$("rp").onchange = () => areaOpts($("rp"), $("ra"));
$("fj").onchange = $("fa").onchange = () => search();

let depth = 0;
function go(id, pop){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  window.scrollTo(0, 0);
  if (!pop){ history.pushState({ v: id }, ""); depth++; }
  if (id === "home") $("bme").hidden = !LS.get("om");
  if (id === "find") search();
  if (id === "me") showMe();
}
window.addEventListener("popstate", e => { depth = Math.max(0, depth - 1); go((e.state && e.state.v) || "home", true); });
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
document.querySelectorAll(".back").forEach(b => b.onclick = () => depth > 0 ? history.back() : go(b.dataset.go, true));
history.replaceState({ v: "home" }, "");
go("home", true);

/* ===== بطاقة المعلم ===== */
function card(w, full){
  const rate = el("div", { className: "rate" });
  const showRate = () => {
    if ((LS.get("or") || []).includes(w.id)){ rate.replaceChildren(el("div", { className: "hint", textContent: "شكراً، تم تقييمك." })); return; }
    if (!(LS.get("oc") || []).includes(w.id)){ rate.replaceChildren(); return; }
    const row = el("div", { className: "stars" });
    for (let n = 1; n <= 5; n++) row.append(el("button", { className: "star", textContent: "★", title: n + " من 5", onclick: async () => {
      try {
        await dbSet(w.id, { sum: w.sum + n, count: w.count + 1 });
        const r = LS.get("or") || []; r.push(w.id); LS.set("or", r); showRate();
      } catch(e){ rate.append(msg("ما تم التقييم. جرب مرة ثانية.", "err")); }
    } }));
    rate.replaceChildren(el("div", { className: "hint", textContent: "كيف كان الشغل؟ قيّم المعلم:" }), row);
  };
  const contact = () => {
    const c = LS.get("oc") || [];
    if (!c.includes(w.id)){ c.push(w.id); LS.set("oc", c); dbSet(w.id, { clicks: w.clicks + 1 }).catch(() => {}); }
    showRate();
  };
  const title = el("b", { textContent: w.name });
  if (w.verified) title.append(el("span", { className: "badge", textContent: "موثّق" }));
  title.append(el("span", { className: "badge" + (w.available ? "" : " off"), textContent: w.available ? "متاح الآن" : "غير متاح" }));
  const heart = el("button", { className: "act" });
  const paintHeart = () => { heart.textContent = (LS.get("of") || []).includes(w.id) ? "♥ بالمفضلة" : "♡ أضف للمفضلة"; };
  heart.onclick = () => {
    const f = LS.get("of") || [], i = f.indexOf(w.id);
    if (i < 0) f.push(w.id); else f.splice(i, 1);
    LS.set("of", f); paintHeart();
  };
  paintHeart();
  const kids = [
    title,
    el("div", { className: "m", textContent: `${w.job} · ${w.area}` }),
    el("div", { className: "rating", textContent: w.count ? `★ ${(w.sum / w.count).toFixed(1)} (${w.count})` : "جديد" })
  ];
  if (full){
    const ph = el("div", { className: "ph" });
    kids.push(ph);
    dbPhotos(w.id).then(a => ph.replaceChildren(...a.map(s => el("img", { src: s, alt: "من شغل " + w.name }))));
  }
  kids.push(el("div", { className: "row" }, [
    el("a", { className: "act", href: "tel:+" + intl(w.phone), textContent: "اتصال", onclick: contact }),
    el("a", { className: "act wa", href: "https://wa.me/" + intl(w.phone), target: "_blank", rel: "noopener", textContent: "واتساب", onclick: contact })
  ]));
  const r2 = el("div", { className: "row" }, [heart]);
  if (!full) r2.append(el("button", { className: "act", textContent: "صفحة المعلم", onclick: () => { $("dt").replaceChildren(card(w, true)); go("det"); } }));
  kids.push(r2, rate);
  showRate();
  return el("div", { className: "w" }, kids);
}

/* ===== البحث ===== */
const FAV = { on: false };
let SR = { items: [], offset: 0, more: false };
let PAID = null;
const paidList = async () => PAID || (PAID = await getPaid());
$("ff").onclick = () => { FAV.on = !FAV.on; $("ff").textContent = FAV.on ? "كل المعلمين" : "المفضلة فقط"; search(); };
function filtersNow(){
  const f = {};
  if ($("fj").value) f.job = $("fj").value;
  if ($("fp").value) f.province = $("fp").value;
  if ($("fa").value) f.area = $("fa").value;
  return f;
}
function renderResults(){
  const box = $("res");
  if (!SR.items.length){ box.replaceChildren(el("div", { className: "empty", textContent: "لسا ما في معلمين هون. جرب مهنة أو منطقة ثانية." })); return; }
  const items = [...SR.items].sort((a, b) => (b.verified - a.verified) || (b.available - a.available) || (score(b) - score(a)));
  const out = items.map(w => card(w, false));
  if (SR.more) out.push(el("button", { className: "btn alt", textContent: "عرض المزيد", onclick: () => search(true) }));
  box.replaceChildren(...out);
}
async function search(more){
  const box = $("res"), PAGE = 20;
  if (!more){ SR = { items: [], offset: 0, more: false }; box.replaceChildren(el("div", { className: "empty", textContent: "عم نحمّل..." })); }
  let batch, paid;
  try {
    if (FAV.on){ batch = (await Promise.all((LS.get("of") || []).map(dbGet))).filter(Boolean); SR.more = false; }
    else { batch = await dbQuery(filtersNow(), PAGE, SR.offset); SR.offset += PAGE; SR.more = batch.length === PAGE; }
    paid = await paidList();
  } catch(e){ box.replaceChildren(msg("ما قدرنا نحمّل القائمة. تأكد من الإنترنت وجرب مرة ثانية.", "err")); return; }
  const now = Date.now();
  SR.items = SR.items.concat(batch.filter(w => !(paid.includes(w.area) && w.paidUntil < now)));
  renderResults();
}

/* ===== التسجيل ===== */
function shrink(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const i = new Image();
      i.onload = () => {
        const s = Math.min(1, 420 / Math.max(i.width, i.height));
        const c = document.createElement("canvas");
        c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
        c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.55));
      };
      i.onerror = () => res("");
      i.src = r.result;
    };
    r.onerror = () => res("");
    r.readAsDataURL(file);
  });
}
$("rs").onclick = async () => {
  const rm = $("rm"), btn = $("rs");
  const w = { name: $("rn").value.trim(), job: $("rj").value, province: $("rp").value, area: $("ra").value, phone: digits($("rt").value) };
  if (w.name.length < 2){ rm.replaceChildren(msg("اكتب اسمك.", "err")); return; }
  if (w.phone.length < 9){ rm.replaceChildren(msg("رقم الواتساب غير صحيح.", "err")); return; }
  btn.disabled = true;
  try {
    const ph = (await Promise.all([...$("rf").files].slice(0, 3).map(shrink))).filter(Boolean);
    const id = await dbAdd({ ...w, verified: false, sum: 0, count: 0, clicks: 0, available: true, paidUntil: 0, photos: JSON.stringify(ph) });
    LS.set("om", id);
    rm.replaceChildren(msg("تم التسجيل. رح يظهر اسمك للزبائن، ولوحتك صارت جاهزة.", "ok"));
    $("rn").value = ""; $("rt").value = ""; $("rf").value = "";
  } catch(e){ rm.replaceChildren(msg("ما تم التسجيل. جرب مرة ثانية.", "err")); }
  btn.disabled = false;
};

/* ===== لوحة العامل ===== */
async function showMe(){
  const box = $("mb"), id = LS.get("om");
  if (!id){ box.replaceChildren(msg("سجّل كعامل أول لتظهر لوحتك هنا.")); return; }
  box.replaceChildren(msg("عم نحمّل..."));
  let w, paid;
  try { [w, paid] = await Promise.all([dbGet(id), getPaid()]); }
  catch(e){ box.replaceChildren(msg("ما قدرنا نحمّل لوحتك.", "err")); return; }
  if (!w){ LS.set("om", null); box.replaceChildren(msg("ما لقينا حسابك. ممكن انحذف، سجّل من جديد.", "err")); return; }
  const now = Date.now();
  const sub = w.paidUntil > now ? `اشتراكك ينتهي بعد ${Math.ceil((w.paidUntil - now) / 864e5)} يوم`
    : paid.includes(w.area) ? "الاشتراك مطلوب بمنطقتك ليظهر اسمك للزبائن" : "منطقتك مجانية حالياً";
  const out = [
    el("div", { className: "w" }, [el("b", { textContent: w.name }), el("div", { className: "m", textContent: `${w.job} · ${w.area}` })]),
    el("button", { className: "btn", textContent: w.available ? "أنا متاح الآن (اضغط لتغيّر)" : "أنا غير متاح (اضغط لتغيّر)", onclick: async () => { await dbSet(w.id, { available: !w.available }).catch(() => {}); showMe(); } }),
    el("div", { className: "w", style: "margin-top:12px" }, [
      el("div", { className: "m", textContent: "هالشهر زبائن ضغطوا على رقمك" }),
      el("div", { className: "stat", textContent: String(w.clicks) }),
      el("div", { className: "rating", textContent: w.count ? `التقييم ★ ${(w.sum / w.count).toFixed(1)} (${w.count})` : "التقييم: جديد" })
    ]),
    el("div", { className: "w", style: "margin-top:12px" }, [
      el("b", { textContent: "الاشتراك" }),
      el("div", { className: "m", textContent: sub }),
      el("div", { className: "hint", textContent: SHAM_NUMBER ? `للتجديد حوّل عبر الشام كاش إلى: ${SHAM_NUMBER}، وبعدين أرسل الإيصال.` : "تفاصيل الدفع رح يرسلها لك فريق أوتايا." })
    ])
  ];
  if (ADMIN_WA) out.push(el("a", { className: "btn alt", style: "text-decoration:none", href: "https://wa.me/" + ADMIN_WA + "?text=" + encodeURIComponent(`مرحبا، هاد إيصال اشتراك أوتايا. الاسم: ${w.name} - ${w.area}`), target: "_blank", rel: "noopener", textContent: "أرسل الإيصال على واتساب" }));
  box.replaceChildren(...out);
}

/* ===== تثبيت التطبيق بضغطة وحدة ===== */
let DEF = null;
const UA = navigator.userAgent;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(UA);
const inApp = !isIOS && /FBAN|FBAV|FB_IAB|Instagram|TikTok|Snapchat|Line\/|; wv\)/i.test(UA);
function showInst(){
  const box = $("inst"), b = $("binst"), h = $("insth");
  b.hidden = false; h.textContent = "";
  if (isStandalone()){ box.hidden = true; return; }
  if (DEF){ b.textContent = "ثبّت التطبيق على موبايلك"; box.hidden = false; return; }
  if (isIOS){ b.hidden = true; h.textContent = "لتثبيت التطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»."; box.hidden = false; return; }
  if (inApp){ b.textContent = "افتح بكروم لتثبيت التطبيق"; h.textContent = "إذا ما فتح: اضغط النقاط الثلاث فوق واختار «فتح في المتصفح»."; box.hidden = false; return; }
  box.hidden = true;
}
$("binst").onclick = async () => {
  if (DEF){ DEF.prompt(); try { await DEF.userChoice; } catch(e){} DEF = null; showInst(); return; }
  if (inApp) location.href = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); DEF = e; showInst(); });
window.addEventListener("appinstalled", () => { DEF = null; $("inst").hidden = true; });
showInst();
